name: Release

# Pushing a tag such as v0.10.45 builds the wheel and the source distribution, checks them, and publishes a GitHub release with the changelog entry as its
# notes and a SHA256SUMS file next to the downloads (`sha256sum -c SHA256SUMS` verifies them).
#
# Only a person with write access to this repository can push a tag, and nothing else triggers this. Two jobs, so the one that runs code is read-only:
#   build    read-only token. Runs the tests, builds, checks the wheel, installs it in a clean environment, writes the checksums.
#   publish  the only job with write access. Runs no code from the repository: it downloads what `build` produced and creates the release.
# maintenance/tests/test_maint_release_workflow.py keeps it that way.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The tag, the version in the code and the changelog agree
        run: |
          python3 maintenance/tools/bump_version.py --check
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but the code is version $version"
            exit 1
          fi
          python3 maintenance/tools/release_notes.py "$version" > release-notes.md
          python3 maintenance/tools/release_notes.py "$version" --title > release-title.txt
          printf '\n---\nThe downloads are checksummed in SHA256SUMS: put it beside them and run `sha256sum -c SHA256SUMS`.\n' >> release-notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install exactly what uv.lock says
        run: uv sync --locked
      - name: Tests (on a bare machine the ones that need period compilers skip and the rest must pass)
        run: uv run --locked pytest -q -rsfE
      - name: Build the wheel and the source distribution
        run: uv build --out-dir dist
      - name: The wheel is complete and clean
        run: python3 maintenance/tools/check_wheel.py dist/*.whl --version "$VERSION"
      - name: The wheel installs and runs in a clean environment (nothing from this checkout)
        run: |
          python3 -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/decomp" --help > /dev/null
          "$RUNNER_TEMP/clean/bin/python" -c "import decompnet; assert decompnet.__version__ == '$VERSION', decompnet.__version__"
      - name: Checksums
        run: |
          mkdir release
          cp dist/*.whl dist/*.tar.gz release-notes.md release/
          cp release-title.txt release/title.txt
          cd release
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.whl release/*.tar.gz release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$(cat release/title.txt)" --notes-file release/release-notes.md
